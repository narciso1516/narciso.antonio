<title>Pequeños Saltos · Matemáticas 2.º de primaria</title>
<style>
:root{--ink:#15325b;--muted:#58708f;--sky:#c9f2ff;--sky2:#eefcff;--card:#ffffffee;--yellow:#ffe680;--shadow:0 14px 34px rgba(40,75,120,.16)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sky),var(--sky2))}body{overflow-x:hidden}button{font:inherit}.app{width:min(100%,560px);margin:auto;padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 24px)}.top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}.logo{background:#fff;border-radius:20px;padding:8px 11px;box-shadow:var(--shadow);font-weight:1000;line-height:1}.logo .small{display:block;font-size:.68rem;color:#16a3b8}.logo .big{font-size:1.05rem}.counter{text-align:center;font-weight:1000;font-size:.86rem;margin-bottom:5px}.bar{height:14px;background:#fff;border-radius:999px;overflow:hidden}.fill{height:100%;width:2%;background:linear-gradient(90deg,#62ce77,#ffd05f,#ff99bd);transition:width .35s}.sound{width:48px;height:48px;border:0;border-radius:16px;background:#fff;box-shadow:var(--shadow);font-size:1.25rem}.levelCard{margin-top:12px;background:var(--card);border-radius:25px;padding:14px;box-shadow:var(--shadow);text-align:center}.levelPill{display:inline-flex;padding:7px 12px;border-radius:999px;font-weight:1000;font-size:.82rem}.title{font-size:clamp(1.25rem,5.8vw,1.7rem);margin:9px 0 4px}.sub{font-size:.9rem;color:var(--muted);font-weight:750;margin:0}.scene{position:relative;margin-top:12px;border-radius:28px;overflow:hidden;background:linear-gradient(180deg,#bdefff 0 45%,#78dcf5 45% 76%,#78cf72 76%);min-height:300px;border:2px solid #fff;box-shadow:var(--shadow)}.cloud{position:absolute;width:84px;height:28px;background:#fff;border-radius:999px;opacity:.78;top:18px;left:20px}.sun{position:absolute;width:48px;height:48px;border-radius:50%;background:#ffe46e;right:18px;top:16px}.speech{position:absolute;left:14px;top:65px;max-width:160px;background:#fff;border:3px solid #73c86a;padding:10px;border-radius:20px;font-weight:1000;font-size:.83rem;z-index:4}.animal{position:absolute;left:24px;bottom:102px;width:64px;height:64px;display:grid;place-items:center;font-size:52px;z-index:6;filter:drop-shadow(0 7px 4px rgba(0,0,0,.16));transform-origin:50% 100%;transition:left .38s cubic-bezier(.22,.8,.24,1)}.animal.hop{animation:hop .38s ease-in-out}@keyframes hop{0%,100%{transform:translateY(0)}46%{transform:translateY(-54px) scale(1.06)}75%{transform:translateY(-10px)}}.now{position:absolute;left:50%;top:-31px;transform:translateX(-50%);background:#fff;border:2px solid #69c97b;border-radius:999px;padding:4px 8px;white-space:nowrap;font-size:.68rem;font-weight:1000}.numberTrack{position:absolute;left:14px;right:14px;bottom:38px;height:75px}.rail{position:absolute;left:0;right:0;top:27px;height:7px;border-radius:999px;background:#9a6a3d}.stones{position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:space-between}.stone{width:42px;height:42px;border-radius:50%;background:#fff2cd;border:3px solid #d9b77d;display:grid;place-items:center;font-size:.95rem;font-weight:1000;z-index:2;box-shadow:0 4px 0 #bb945f}.stone.active{background:#fff08e;border-color:#ffb84f;transform:scale(1.08)}.questionZone{background:#fff;border-radius:25px;margin-top:12px;padding:14px;box-shadow:var(--shadow)}.prompt{text-align:center;font-size:1rem;font-weight:1000;margin-bottom:10px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answer{min-height:62px;border:0;border-radius:18px;font-size:1.25rem;font-weight:1000;color:#17345f;box-shadow:0 5px 0 #c9d6e7}.answer:nth-child(1){background:#ffe1ec}.answer:nth-child(2){background:#d9efff}.answer:nth-child(3){background:#daf6d4}.answer:nth-child(4){background:#fff0b6}.answer.good{background:#bff2c1}.answer.bad{background:#ffd5dc}.feedback{min-height:34px;padding-top:10px;text-align:center;font-weight:1000}.next{display:none;width:116px;height:78px;margin:8px auto 0;border:0;border-radius:50%;background:#ff7dac;color:#fff;font-weight:1000;box-shadow:0 8px 0 #d84d83}.next.show{display:block}.levelStrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}.levelDot{background:#ffffffc9;border-radius:14px;padding:7px 3px;text-align:center;font-size:.58rem;font-weight:1000}.levelDot .emoji{display:block;font-size:1.25rem}.levelDot.current{background:#fff0a8}.levelDot.done{background:#dff6dc}.tip{text-align:center;background:#fff8d6;border-radius:16px;padding:8px;margin-top:10px;font-size:.8rem;font-weight:900}.finish{display:none;background:#fff;border-radius:28px;padding:25px 16px;text-align:center;margin-top:12px;box-shadow:var(--shadow)}.finish.show{display:block}.restart{border:0;border-radius:18px;background:#6acb79;color:#fff;padding:14px 18px;font-weight:1000}.footer{text-align:center;font-size:.7rem;color:#58708f;margin-top:12px}.confetti{position:fixed;width:9px;height:14px;pointer-events:none;z-index:999;animation:fall 1.15s ease-out forwards}@keyframes fall{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}@media(max-width:390px){.app{padding-left:8px;padding-right:8px}.stone{width:34px;height:34px;font-size:.8rem}.numberTrack{left:8px;right:8px}.animal{font-size:46px;width:56px;height:56px}}
</style></head><body><main class="app"><section id="game"><div class="top"><div class="logo"><span class="small">MATEMÁTICAS</span><span class="big">Pequeños Saltos</span></div><div><div class="counter" id="counter">Reto 1 de 50</div><div class="bar"><div class="fill" id="fill"></div></div></div><button class="sound" id="soundBtn">🔊</button></div><section class="levelCard"><div class="levelPill" id="levelPill"></div><h1 class="title" id="questionTitle"></h1><p class="sub" id="questionSub"></p></section><section class="scene"><div class="cloud"></div><div class="sun"></div><div class="speech" id="speech"></div><div class="animal" id="animal"><span class="now" id="now"></span><span id="animalEmoji"></span></div><div class="numberTrack"><div class="rail"></div><div class="stones" id="stones"></div></div></section><section class="questionZone"><div class="prompt">Toca el número de llegada:</div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="nextBtn">¡PÓP!<br>Siguiente</button></section><div class="levelStrip" id="levelStrip"></div><div class="tip">⭐ Cada salto correcto te lleva a un nuevo animalito.</div></section><section class="finish" id="finish"><div style="font-size:4rem">🏆🐘✨</div><h2>¡Completaste los 50 retos!</h2><p>Practicaste saltos desde 1 en 1 hasta 10 en 10.</p><button class="restart" id="restartBtn">Jugar otra vez</button></section><div class="footer">Actividad educativa · 2.º de primaria · Conteo y secuencias</div></main><script>(()=>{"use strict";const animals=["🐸","🐶","🐱","🐼","🐻","🐧","🦊","🐰","🦁","🐘"],names=["ranita","perrito","gatito","pandita","osito","pingüinito","zorrito","conejito","leoncito","elefantito"],colors=["#ddf6d8","#e0efff","#ffe3ed","#e8e3ff","#ffe5bf","#dff7ff","#ffe1cf","#ffe6f2","#fff0bf","#dfeeff"],base={1:[0,4,9,15,22],2:[0,6,12,20,28],3:[0,6,12,21,30],4:[0,8,16,24,32],5:[0,10,20,30,40],6:[0,12,24,36,48],7:[0,14,28,42,56],8:[0,16,32,48,64],9:[0,18,36,54,72],10:[0,20,40,60,70]},ch=[];for(let s=1;s<=10;s++)for(let n=0;n<5;n++){let h=s<=3?4:3,st=base[s][n];ch.push({step:s,start:st,target:st+s*h,hops:h,animal:s-1})}let i=0,locked=false,sound=true,ctx=null;const $=s=>document.querySelector(s),counter=$("#counter"),fill=$("#fill"),pill=$("#levelPill"),title=$("#questionTitle"),sub=$("#questionSub"),speech=$("#speech"),animal=$("#animal"),emoji=$("#animalEmoji"),now=$("#now"),stones=$("#stones"),answers=$("#answers"),feedback=$("#feedback"),next=$("#nextBtn"),strip=$("#levelStrip"),game=$("#game"),finish=$("#finish");function beep(f=520,d=.08){if(!sound)return;try{const A=window.AudioContext||window.webkitAudioContext;ctx=ctx||new A();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.value=.045;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.stop(ctx.currentTime+d)}catch(e){}}function shuffle(a){a=[...a];for(let x=a.length-1;x>0;x--){let y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}return a}function choices(c){return shuffle([c.target,c.target-c.step,c.target+c.step,c.target+2*c.step])}function line(c){stones.innerHTML="";for(let k=0;k<=c.hops;k++){let v=c.start+c.step*k,s=document.createElement("div");s.className="stone"+(k===0?" active":"");s.dataset.value=v;s.textContent=v;stones.appendChild(s)}}function pos(v,anim=false){let s=[...stones.children].find(x=>+x.dataset.value===v);if(!s)return;let r=stones.getBoundingClientRect(),q=s.getBoundingClientRect();animal.style.transition=anim?"left .38s cubic-bezier(.22,.8,.24,1)":"none";animal.style.left=(q.left-r.left+q.width/2-animal.offsetWidth/2+14)+"px";now.innerHTML=`Voy en: <strong>${v}</strong>`;[...stones.children].forEach(x=>x.classList.toggle("active",+x.dataset.value===v))}function dots(){strip.innerHTML="";for(let l=1;l<=10;l++){let d=document.createElement("div");d.className="levelDot"+(l<Math.floor(i/5)+1?" done":"")+(l===Math.floor(i/5)+1?" current":"");d.innerHTML=`<span class="emoji">${animals[l-1]}</span>${l} en ${l}`;strip.appendChild(d)}}function render(){locked=false;let c=ch[i],l=c.step;counter.textContent=`Reto ${i+1} de 50`;fill.style.width=`${(i+1)*2}%`;pill.textContent=`${animals[c.animal]} Nivel ${l} · De ${l} en ${l}`;pill.style.background=colors[c.animal];title.textContent=`El ${names[c.animal]} salta de ${l} en ${l}`;sub.textContent=`Empieza en ${c.start} y hará ${c.hops} saltos. ¿A qué número llegará?`;speech.textContent=`¡Voy a saltar de ${l} en ${l}!`;emoji.textContent=animals[c.animal];line(c);answers.innerHTML="";feedback.textContent="";next.className="next";choices(c).forEach(v=>{let b=document.createElement("button");b.className="answer";b.textContent=v;b.onclick=()=>choose(v,b,c);answers.appendChild(b)});dots();requestAnimationFrame(()=>pos(c.start))}async function hop(c){for(let k=1;k<=c.hops;k++){let v=c.start+c.step*k;await new Promise(r=>setTimeout(r,180));animal.classList.remove("hop");void animal.offsetWidth;animal.classList.add("hop");pos(v,true);beep(360+k*38,.09);await new Promise(r=>setTimeout(r,420))}}async function choose(v,b,c){if(locked)return;if(v!==c.target){b.classList.add("bad");beep(190,.13);feedback.textContent="Casi. Vuelve a intentarlo 💛";setTimeout(()=>b.classList.remove("bad"),400);return}locked=true;[...answers.children].forEach(x=>x.disabled=true);b.classList.add("good");feedback.textContent="¡Correcto! Mira cómo salta paso a paso…";await hop(c);beep(700,.15);feedback.textContent=`¡Muy bien! Llegó al ${c.target}.`;next.classList.add("show")}next.onclick=()=>{i++;if(i>=50){game.style.display="none";finish.classList.add("show")}else render()};$("#soundBtn").onclick=e=>{sound=!sound;e.currentTarget.textContent=sound?"🔊":"🔇"};$("#restartBtn").onclick=()=>{i=0;game.style.display="block";finish.classList.remove("show");render()};window.onresize=()=>{if(i<50)pos(ch[i].start)};render()})();</script></body></html>
