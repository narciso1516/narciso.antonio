<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Progresión 5 · Cuestionario de Fabián</title>
<style>
:root{--azul:#185b9d;--azul2:#0e3d6b;--claro:#eaf4ff;--ok:#18864b;--bad:#bd3535;--texto:#23313d}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,#eef6ff,#fff);color:var(--texto)}
header{background:linear-gradient(120deg,var(--azul2),var(--azul));color:white;padding:22px;text-align:center}
header h1{margin:0;font-size:clamp(24px,4vw,38px)} header p{margin:7px 0 0}
.wrap{max-width:900px;margin:auto;padding:18px} .progress{height:12px;background:#dce7f1;border-radius:20px;overflow:hidden;margin:12px 0 20px}
.bar{height:100%;width:0;background:var(--azul);transition:.3s}
.card{background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px #174a7720;border:1px solid #dce9f5}
.badge{color:var(--azul);font-weight:bold;margin-bottom:10px} h2{font-size:clamp(20px,3vw,27px);margin:5px 0 18px}
.options{display:grid;gap:11px} button.option{text-align:left;border:2px solid #d8e5f0;background:#fff;border-radius:13px;padding:14px;font-size:16px;cursor:pointer}
button.option:hover{border-color:var(--azul);background:var(--claro)} button.option.correct{border-color:var(--ok);background:#eaf8f0} button.option.wrong{border-color:var(--bad);background:#fff0f0}
.feedback{display:none;margin-top:17px;padding:14px;border-radius:12px;background:var(--claro);line-height:1.45}
.controls{display:flex;justify-content:flex-end;margin-top:16px} .next{display:none;background:var(--azul);color:white;border:0;border-radius:11px;padding:12px 22px;font-weight:bold;cursor:pointer}
.result{text-align:center} .score{font-size:54px;color:var(--azul);font-weight:800} .mini{color:#5d6b78}
.restart{background:var(--azul);color:#fff;border:0;border-radius:10px;padding:12px 20px;cursor:pointer}
.tip{margin-top:18px;padding:14px;border-left:5px solid var(--azul);background:#f3f8fd;border-radius:8px}
</style>
</head>
<body>
<header><h1>Progresión 5</h1><p>Liberales y conservadores en el México del siglo XIX · 25 preguntas</p></header>
<main class="wrap">
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="card" id="card"></section>
</main>
<script>
const Q=[{"q": "¿Qué problema tuvo México después de conseguir su Independencia?", "o": ["Decidir cómo organizar y gobernar el nuevo país", "Volver a formar parte de España", "Elegir un idioma nuevo", "Cambiar el nombre de todos los estados"], "a": 0, "e": "México ya era independiente, pero todavía debía decidir cómo organizar su gobierno y su vida política."}, {"q": "¿Por qué la Independencia no significó que todos estuvieran de acuerdo?", "o": ["Porque existían diferentes ideas sobre cómo debía organizarse México", "Porque nadie quería tener leyes", "Porque todos querían regresar al gobierno español", "Porque México dejó de tener población"], "a": 0, "e": "Después de la Independencia surgieron distintos proyectos políticos para el futuro del país."}, {"q": "¿Cuáles fueron las dos posturas políticas principales que estudiamos?", "o": ["Liberales y conservadores", "Insurgentes y españoles", "Campesinos y comerciantes", "Federalistas y franceses"], "a": 0, "e": "La lectura se centra en las diferencias entre liberales y conservadores."}, {"q": "¿Qué defendían principalmente los liberales?", "o": ["Libertades individuales y una república federal", "Una monarquía controlada por España", "Eliminar los gobiernos estatales", "Dar todo el poder a una sola autoridad"], "a": 0, "e": "Los liberales defendían libertades individuales, federalismo, división de poderes y separación Iglesia-Estado."}, {"q": "¿Qué significa una república federal?", "o": ["Que los estados tienen cierta autonomía dentro del país", "Que un emperador gobierna todo el territorio", "Que no existen leyes nacionales", "Que cada estado es un país independiente"], "a": 0, "e": "En el federalismo los estados conservan autonomía dentro de una organización nacional."}, {"q": "¿Qué separación defendían los liberales?", "o": ["La separación entre la Iglesia y el Estado", "La separación entre México y sus estados", "La separación entre ciudadanos y leyes", "La separación entre escuelas y familias"], "a": 0, "e": "Una idea liberal importante fue separar las funciones de la Iglesia de las del Estado."}, {"q": "¿Qué busca la división de poderes?", "o": ["Evitar que todo el poder quede concentrado en una sola autoridad", "Dividir a México en países diferentes", "Eliminar las leyes", "Dar todo el poder al presidente"], "a": 0, "e": "La división de poderes distribuye las funciones del gobierno en lugar de concentrarlas en una sola autoridad."}, {"q": "¿Qué defendían los conservadores?", "o": ["Un orden más tradicional y un gobierno central fuerte", "Eliminar cualquier forma de gobierno", "Que cada estado fuera totalmente independiente", "Que México volviera a ser una colonia"], "a": 0, "e": "Los conservadores defendían un orden tradicional y favorecieron proyectos monárquicos o centralistas."}, {"q": "¿Qué forma de gobierno apoyaron algunos conservadores?", "o": ["La monarquía o una república centralista", "Una república sin leyes", "Un gobierno extranjero permanente", "Una democracia sin autoridades"], "a": 0, "e": "Entre las propuestas conservadoras estuvieron la monarquía y la república centralista."}, {"q": "¿Qué significa centralismo?", "o": ["Que el gobierno nacional concentra mayor poder", "Que cada estado toma todas sus decisiones sin gobierno nacional", "Que no existe un gobierno", "Que la Iglesia gobierna automáticamente el país"], "a": 0, "e": "En el centralismo se concentra más autoridad en el gobierno nacional."}, {"q": "¿Cuál es la diferencia básica entre federalismo y centralismo?", "o": ["El federalismo da mayor autonomía a los estados; el centralismo concentra más poder nacional", "El federalismo tiene rey y el centralismo no tiene gobierno", "El federalismo elimina estados y el centralismo crea países", "No existe ninguna diferencia"], "a": 0, "e": "La diferencia principal está en cuánto poder tienen los estados frente al gobierno central."}, {"q": "¿Quién fue Agustín de Iturbide en esta etapa?", "o": ["El primer emperador del México independiente", "Un presidente de Estados Unidos", "Un rey de España del siglo XX", "El creador de la Constitución de 1917"], "a": 0, "e": "Iturbide fue proclamado emperador de México después de la Independencia."}, {"q": "¿Qué cargo tuvo Agustín de Iturbide?", "o": ["Emperador de México", "Gobernador de Francia", "Presidente de España", "Virrey de Estados Unidos"], "a": 0, "e": "Iturbide encabezó el Primer Imperio Mexicano como emperador."}, {"q": "¿Por qué es importante estudiar el Imperio de Iturbide?", "o": ["Porque muestra uno de los primeros intentos de organizar el México independiente", "Porque fue el gobierno que duró todo el siglo XIX", "Porque eliminó todas las diferencias políticas", "Porque convirtió a México nuevamente en colonia"], "a": 0, "e": "El Imperio fue uno de los primeros proyectos para decidir cómo gobernar al nuevo país."}, {"q": "¿Por qué la Iglesia era importante en la sociedad mexicana?", "o": ["Porque tenía una fuerte presencia social desde la época colonial", "Porque apareció por primera vez en 1917", "Porque era el único gobierno de México", "Porque no tenía relación con la vida pública"], "a": 0, "e": "La Iglesia tenía una presencia histórica importante en la sociedad desde la época colonial."}, {"q": "¿Qué se discutía sobre la Iglesia durante el siglo XIX?", "o": ["Qué papel debía tener en la vida pública y política", "Si debía cambiar el idioma de México", "Si debía elegir todos los presidentes", "Si debía desaparecer la educación"], "a": 0, "e": "El papel público y político de la Iglesia fue parte de las diferencias entre proyectos políticos."}, {"q": "¿Por qué México tuvo diferentes constituciones y leyes?", "o": ["Porque buscaba una forma estable de organizar el país", "Porque cada año cambiaba de idioma", "Porque no existían problemas políticos", "Porque España escribía todas las constituciones"], "a": 0, "e": "Los cambios constitucionales reflejan la búsqueda de una organización política estable."}, {"q": "¿Cuál de estos documentos aparece en el tema?", "o": ["Constitución de 1824", "Constitución francesa de 1958", "Carta Magna inglesa de 1215", "Tratado de Versalles de 1919"], "a": 0, "e": "La Constitución de 1824 forma parte de los documentos estudiados en la progresión."}, {"q": "¿Qué pasó entre federalismo y centralismo durante el siglo XIX?", "o": ["México cambió y discutió entre ambas formas de organización", "Los dos sistemas desaparecieron inmediatamente", "México nunca tuvo debates sobre ellos", "Ambos significaban exactamente lo mismo"], "a": 0, "e": "La organización del país cambió entre proyectos federalistas y centralistas."}, {"q": "¿Por qué hubo tantos cambios políticos en México durante el siglo XIX?", "o": ["Porque el país estaba buscando cómo organizarse después de la Independencia", "Porque México todavía no se había independizado", "Porque todos los grupos tenían las mismas ideas", "Porque no existían constituciones"], "a": 0, "e": "Después de independizarse, México pasó décadas definiendo su forma de gobierno e instituciones."}, {"q": "Completa la idea: Después de independizarse de España, México todavía tenía que…", "o": ["decidir cómo organizarse y gobernarse", "pedir permiso a Francia para existir", "eliminar todos sus estados", "dejar de crear leyes"], "a": 0, "e": "La independencia resolvió la separación de España, pero no definió automáticamente la organización del nuevo país."}, {"q": "Completa: Liberales y conservadores no pensaban igual porque…", "o": ["tenían diferentes ideas sobre el gobierno, la Iglesia y las leyes", "hablaban idiomas distintos", "vivían en países diferentes", "unos conocían México y otros no"], "a": 0, "e": "Sus diferencias incluían la forma de gobierno, el poder central, la Iglesia y las leyes."}, {"q": "Si alguien pregunta «¿de qué trata la Progresión 5?», ¿cuál es la mejor respuesta?", "o": ["De las distintas ideas y proyectos para organizar México durante el siglo XIX", "Solamente de la guerra contra España", "Solamente de la vida de Iturbide", "De la historia de Francia en el siglo XX"], "a": 0, "e": "La progresión explica distintos proyectos políticos y sus efectos en la organización de México."}, {"q": "¿Cómo influyeron liberales y conservadores en la construcción de México?", "o": ["Sus diferentes proyectos influyeron en gobiernos, leyes y constituciones", "No tuvieron ninguna influencia política", "Solamente participaron en actividades religiosas", "Ambos defendieron siempre exactamente las mismas ideas"], "a": 0, "e": "Las diferencias entre ambos grupos influyeron en la organización política y constitucional del país."}, {"q": "¿Cuál resume mejor todo el tema?", "o": ["México tuvo que construir su organización política después de la Independencia entre diferentes proyectos e ideas", "México quedó completamente organizado en cuanto terminó la Independencia", "El único problema del siglo XIX fue elegir un emperador", "Las constituciones no tuvieron relación con la organización del país"], "a": 0, "e": "La idea central es que la construcción del México independiente fue un proceso con distintos proyectos, conflictos y cambios legales."}]; let i=0,score=0,answered=false;
function render(){
 const x=Q[i], card=document.getElementById('card'); answered=false;
 document.getElementById('bar').style.width=((i)/Q.length*100)+'%';
 card.innerHTML=`<div class="badge">Pregunta ${i+1} de ${Q.length}</div><h2>${x.q}</h2>
 <div class="options">${x.o.map((v,j)=>`<button class="option" onclick="pick(${j},this)"><b>${String.fromCharCode(65+j)}.</b> ${v}</button>`).join('')}</div>
 <div class="feedback" id="fb"></div><div class="controls"><button class="next" id="next" onclick="go()">Siguiente →</button></div>`;
}
function pick(j,el){
 if(answered)return; answered=true; const x=Q[i], btn=[...document.querySelectorAll('.option')];
 btn.forEach((b,k)=>{b.disabled=true;if(k===x.a)b.classList.add('correct')}); 
 if(j===x.a){score++;} else el.classList.add('wrong');
 const fb=document.getElementById('fb'); fb.style.display='block';
 fb.innerHTML=(j===x.a?'<b>¡Muy bien!</b> ':'<b>Repásalo:</b> ')+x.e;
 document.getElementById('next').style.display='block';
}
function go(){i++; if(i<Q.length)render(); else finish();}
function finish(){
 document.getElementById('bar').style.width='100%';
 let msg=score>=22?'Muy buen dominio del tema.':score>=18?'Buen avance; conviene repasar algunas ideas.':'Conviene volver a leer el resumen antes de exponer.';
 document.getElementById('card').innerHTML=`<div class="result"><h2>Resultado final</h2><div class="score">${score} / 25</div><p>${msg}</p>
 <div class="tip"><b>Reto para la exposición:</b> explica sin leer, durante un minuto, por qué México todavía tuvo que decidir cómo organizarse después de la Independencia.</div>
 <p class="mini">El objetivo no es memorizar: es entender las ideas para poder explicarlas con palabras propias.</p>
 <button class="restart" onclick="location.reload()">Intentar de nuevo</button></div>`;
}
render();
</script>
</body></html>
