<!doctype html>

<title>La Ranita Saltarina · Secuencias</title>
<style>
:root{--ink:#17324d;--green:#48bb78;--green2:#9ae6b4;--sky:#dff7ff;--yellow:#ffd166;--pink:#ff8fab;--purple:#9b8afb;--card:#fff;--shadow:0 14px 35px rgba(29,64,90,.16)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold",system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,#bfeeff 0,#e8fbff 42%,#f7fff3 100%)}body{min-height:100dvh;overflow-x:hidden}.app{width:min(100%,520px);min-height:100dvh;margin:auto;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 18px);position:relative;isolation:isolate}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}.badge{background:rgba(255,255,255,.84);padding:8px 12px;border-radius:999px;font-weight:900;font-size:.86rem}.sound{border:0;background:#fff;width:44px;height:44px;border-radius:50%;font-size:1.2rem}.progress-wrap{background:rgba(255,255,255,.75);height:13px;border-radius:999px;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,#48bb78,#ffd166,#ff8fab);border-radius:inherit;transition:width .45s}.hero{text-align:center;padding:8px 0 6px}.hero h1{font-size:clamp(1.7rem,7vw,2.35rem);margin:4px 0 2px}.hero p{margin:5px auto 0;font-size:.95rem;font-weight:750;opacity:.78}.card{background:rgba(255,255,255,.93);border-radius:28px;padding:18px 14px 20px;box-shadow:0 14px 35px rgba(29,64,90,.16)}.level{display:inline-flex;padding:6px 10px;background:#f3f0ff;color:#5a4db2;border-radius:999px;font-weight:950;font-size:.78rem}.question{font-size:1.12rem;font-weight:950;text-align:center;margin:12px 5px 5px}.hint{text-align:center;margin:0 0 12px;font-size:.88rem;font-weight:750;opacity:.66}.pond{position:relative;height:180px;margin:8px 0 4px;border-radius:24px;background:linear-gradient(#d9f7ff 0 58%,#a7e57c 58% 66%,#67c96f 66%);overflow:hidden;border:2px solid #d5f4ff}.sun{position:absolute;width:50px;height:50px;border-radius:50%;background:#ffd166;right:15px;top:15px}.lily{position:absolute;width:52px;height:20px;border-radius:50%;background:#42ad64;bottom:25px;right:22px}.track{position:absolute;left:18px;right:18px;bottom:60px;height:8px;background:#fff;border-radius:99px}.tick{position:absolute;top:50%;width:4px;height:18px;background:#6b7280;border-radius:4px;transform:translate(-50%,-50%)}.tick-label{position:absolute;top:18px;transform:translateX(-50%);font-size:.72rem;font-weight:950}.frog{position:absolute;left:19px;bottom:74px;width:56px;height:56px;display:grid;place-items:center;font-size:44px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.16));transform-origin:50% 100%;transition:left .42s cubic-bezier(.22,.8,.24,1);z-index:5}.frog.hop{animation:hop .42s ease-in-out}.frog-number{position:absolute;left:50%;top:-32px;transform:translateX(-50%);min-width:72px;padding:5px 9px;border-radius:999px;background:#fff;border:2px solid #9ae6b4;font-size:.72rem;font-weight:1000;white-space:nowrap}.frog-number strong{font-size:.9rem;color:#21884a}@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-48px) rotate(-7deg)}72%{transform:translateY(-12px) rotate(4deg)}}.sequence{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:7px;margin:12px 0}.num{min-width:48px;padding:10px 9px;border-radius:14px;background:#eefcff;border:2px solid #c8f0fa;font-size:1.2rem;font-weight:1000;text-align:center}.arrow{font-weight:1000;opacity:.45}.blank{background:#fff4bf;border-color:#ffd166}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.answer{min-height:62px;border:0;border-radius:18px;font-size:1.23rem;font-weight:1000;color:#243b53;background:#f4f7fb;box-shadow:0 5px 0 #d9e2ec}.answer:nth-child(1){background:#e0f7fa}.answer:nth-child(2){background:#fff3bf}.answer:nth-child(3){background:#fce1ec}.answer:nth-child(4){background:#ebe4ff}.answer.good{background:#b7f7c8}.answer.bad{background:#ffd9df;animation:shake .35s}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}.feedback{min-height:30px;text-align:center;margin:12px 0 5px;font-weight:950}.feedback.ok{color:#21884a}.feedback.no{color:#cf3f58}.balloon{display:none;margin:10px auto 0;border:0;width:92px;height:108px;border-radius:50%;background:linear-gradient(145deg,#ff8fab,#ff5f8e);color:#fff;font-weight:1000;font-size:.94rem;box-shadow:0 10px 0 #d7476d}.balloon.show{display:block}.stars{display:flex;justify-content:center;gap:5px;margin:5px 0}.star{font-size:1.15rem;filter:grayscale(1);opacity:.35}.star.on{filter:none;opacity:1}.confetti{position:fixed;width:9px;height:14px;pointer-events:none;z-index:99;animation:fall 1.1s ease-out forwards}@keyframes fall{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}.finish{display:none;text-align:center;padding:28px 12px}.finish.show{display:block}.finish .big{font-size:5rem}.restart{border:0;background:#6857e5;color:#fff;padding:15px 22px;border-radius:18px;font-size:1rem;font-weight:1000}.tiny{text-align:center;font-size:.72rem;opacity:.55;margin-top:14px;font-weight:700}
</style></head><body><main class="app"><div class="top"><div class="badge" id="counter">Reto 1 de 30</div><button class="sound" id="soundBtn">🔊</button></div><div class="progress-wrap"><div class="progress" id="progress"></div></div><header class="hero"><h1>🐸 La Ranita Saltarina</h1><p>Descubre cómo salta la ranita y completa la secuencia.</p><div class="stars" id="stars"></div></header><section class="card" id="gameCard"><div id="gameView"><span class="level" id="level"></span><div class="question">¿Qué número falta?</div><div class="hint">Mira con atención cómo cambian los números.</div><div class="pond"><div class="sun"></div><div class="track" id="track"></div><div class="frog" id="frog"><span class="frog-number" id="frogNumber">Voy en: <strong>1</strong></span>🐸</div><div class="lily"></div></div><div class="sequence" id="sequence"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="balloon" id="nextBtn">¡PÓP!<br>Siguiente</button></div><div class="finish" id="finish"><span class="big">🏆🐸</span><h2>¡Misión cumplida!</h2><p id="finalText"></p><button class="restart" id="restartBtn">Jugar otra vez</button></div></section><div class="tiny">Actividad educativa · 2.º de primaria · Conteo y secuencias</div></main><script>
(()=>{'use strict';const challenges=[{seq:[1,2,3,4,null],a:5,step:1,l:'🌱 Nivel 1 · Saltos de 1'},{seq:[6,7,null,9,10],a:8,step:1,l:'🌱 Nivel 1 · Saltos de 1'},{seq:[12,null,14,15,16],a:13,step:1,l:'🌱 Nivel 1 · Saltos de 1'},{seq:[21,22,23,null,25],a:24,step:1,l:'🌱 Nivel 1 · Saltos de 1'},{seq:[34,35,null,37,38],a:36,step:1,l:'🌱 Nivel 1 · Saltos de 1'},{seq:[10,9,8,null,6],a:7,step:-1,l:'🍃 Nivel 2 · Hacia atrás'},{seq:[20,null,18,17,16],a:19,step:-1,l:'🍃 Nivel 2 · Hacia atrás'},{seq:[31,30,29,null,27],a:28,step:-1,l:'🍃 Nivel 2 · Hacia atrás'},{seq:[45,44,null,42,41],a:43,step:-1,l:'🍃 Nivel 2 · Hacia atrás'},{seq:[60,null,58,57,56],a:59,step:-1,l:'🍃 Nivel 2 · Hacia atrás'},{seq:[2,4,6,null,10],a:8,step:2,l:'🌼 Nivel 3 · Saltos de 2'},{seq:[5,7,null,11,13],a:9,step:2,l:'🌼 Nivel 3 · Saltos de 2'},{seq:[14,16,18,null,22],a:20,step:2,l:'🌼 Nivel 3 · Saltos de 2'},{seq:[31,null,35,37,39],a:33,step:2,l:'🌼 Nivel 3 · Saltos de 2'},{seq:[50,48,null,44,42],a:46,step:-2,l:'🌼 Nivel 3 · Saltos de 2'},{seq:[5,10,15,null,25],a:20,step:5,l:'🌺 Nivel 4 · Saltos de 5'},{seq:[20,25,null,35,40],a:30,step:5,l:'🌺 Nivel 4 · Saltos de 5'},{seq:[45,null,55,60,65],a:50,step:5,l:'🌺 Nivel 4 · Saltos de 5'},{seq:[90,85,80,null,70],a:75,step:-5,l:'🌺 Nivel 4 · Saltos de 5'},{seq:[35,40,45,null,55],a:50,step:5,l:'🌺 Nivel 4 · Saltos de 5'},{seq:[10,20,30,null,50],a:40,step:10,l:'🚀 Nivel 5 · Saltos de 10'},{seq:[25,35,null,55,65],a:45,step:10,l:'🚀 Nivel 5 · Saltos de 10'},{seq:[42,null,62,72,82],a:52,step:10,l:'🚀 Nivel 5 · Saltos de 10'},{seq:[100,90,80,null,60],a:70,step:-10,l:'🚀 Nivel 5 · Saltos de 10'},{seq:[13,23,null,43,53],a:33,step:10,l:'🚀 Nivel 5 · Saltos de 10'},{seq:[3,6,9,null,15],a:12,step:3,l:'🧠 Nivel 6 · Descubre el salto'},{seq:[4,8,null,16,20],a:12,step:4,l:'🧠 Nivel 6 · Descubre el salto'},{seq:[7,14,21,null,35],a:28,step:7,l:'🧠 Nivel 6 · Descubre el salto'},{seq:[72,66,null,54,48],a:60,step:-6,l:'🧠 Nivel 6 · Descubre el salto'},{seq:[11,22,33,null,55],a:44,step:11,l:'👑 Reto final · ¡Tú puedes!'}];let i=0,score=0,locked=false,soundOn=true;const $=s=>document.querySelector(s),counter=$('#counter'),progress=$('#progress'),level=$('#level'),seqEl=$('#sequence'),answers=$('#answers'),feedback=$('#feedback'),nextBtn=$('#nextBtn'),frog=$('#frog'),frogNumber=$('#frogNumber'),track=$('#track'),stars=$('#stars');function audio(freq=520,d=.09,type='sine',vol=.06){if(!soundOn)return;try{const A=window.AudioContext||window.webkitAudioContext,ctx=audio.ctx||(audio.ctx=new A()),o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(ctx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.stop(ctx.currentTime+d)}catch(e){}}function successSound(){audio(523,.12);setTimeout(()=>audio(659,.12),90);setTimeout(()=>audio(784,.18),180)}function badSound(){audio(170,.16,'square',.035)}function confetti(){const cols=['#ff8fab','#ffd166','#48bb78','#5fc9f8','#9b8afb','#ff9f43'];for(let n=0;n<26;n++){const c=document.createElement('i');c.className='confetti';c.style.left=(20+Math.random()*60)+'vw';c.style.top=(35+Math.random()*20)+'vh';c.style.background=cols[n%cols.length];c.style.setProperty('--x',(Math.random()*240-120)+'px');c.style.setProperty('--y',(120+Math.random()*320)+'px');c.style.setProperty('--r',(Math.random()*720-360)+'deg');document.body.appendChild(c);setTimeout(()=>c.remove(),1200)}}function shuffle(a){for(let x=a.length-1;x>0;x--){let y=Math.floor(Math.random()*(x+1));[a[x],a[y]]=[a[y],a[x]]}return a}function distractors(a,step){let pool=[a+step,a-step,a+Math.sign(step||1)*2,a-Math.sign(step||1)*3,a+5,a-5].filter(x=>x>=0&&x!==a);pool=[...new Set(pool)];while(pool.length<3){let x=Math.max(0,a+Math.floor(Math.random()*13)-6);if(x!==a&&!pool.includes(x))pool.push(x)}return shuffle([a,...pool.slice(0,3)])}function getHopValues(c){const known=c.seq.filter(v=>v!==null),start=known[0],target=c.a,step=c.step||1,vals=[start];if(step>0){for(let v=start+step;v<=target;v+=step)vals.push(v)}else{for(let v=start+step;v>=target;v+=step)vals.push(v)}if(vals[vals.length-1]!==target)vals.push(target);return vals}function positionFor(v){const mn=Number(track.dataset.min),mx=Number(track.dataset.max),range=mx-mn||1;return 18+((v-mn)/range)*(track.clientWidth-36)}function setFrogAt(v,animate=true){frog.style.transition=animate?'left .42s cubic-bezier(.22,.8,.24,1)':'none';frog.style.left=(positionFor(v)-28)+'px';frogNumber.innerHTML='Voy en: <strong>'+v+'</strong>'}function drawTrack(c){track.innerHTML='';const hops=getHopValues(c),all=[...new Set(c.seq.filter(v=>v!==null).concat([c.a],hops))],mn=Math.min(...all),mx=Math.max(...all),range=mx-mn||1;track.dataset.min=mn;track.dataset.max=mx;all.sort((a,b)=>a-b).forEach(v=>{let t=document.createElement('span');t.className='tick';t.style.left=(5+(v-mn)/range*90)+'%';let lab=document.createElement('span');lab.className='tick-label';lab.textContent=v;t.appendChild(lab);track.appendChild(t)});setFrogAt(hops[0],false)}function hopSound(v){audio(360+(Math.abs(v)%8)*45,.075,'sine',.045)}async function animateHops(c){const hops=getHopValues(c);for(let idx=1;idx<hops.length;idx++){const v=hops[idx];frog.classList.remove('hop');void frog.offsetWidth;frog.classList.add('hop');setFrogAt(v,true);hopSound(v);feedback.textContent='🐸 La ranita va en '+v;await new Promise(r=>setTimeout(r,500))}}function renderStars(){stars.innerHTML='';let filled=Math.floor(score/3);for(let n=0;n<10;n++){let s=document.createElement('span');s.className='star'+(n<filled?' on':'');s.textContent='⭐';stars.appendChild(s)}}function render(){locked=false;let c=challenges[i];counter.textContent=`Reto ${i+1} de ${challenges.length}`;progress.style.width=(i/challenges.length*100)+'%';level.textContent=c.l;feedback.textContent='';feedback.className='feedback';nextBtn.classList.remove('show');seqEl.innerHTML='';answers.innerHTML='';c.seq.forEach((v,k)=>{let b=document.createElement('div');b.className='num'+(v===null?' blank':'');b.textContent=v===null?'?':v;seqEl.appendChild(b);if(k<c.seq.length-1){let ar=document.createElement('span');ar.className='arrow';ar.textContent='→';seqEl.appendChild(ar)}});distractors(c.a,c.step).forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.addEventListener('click',()=>choose(b,v));answers.appendChild(b)});drawTrack(c);renderStars()}async function choose(btn,v){if(locked)return;let c=challenges[i];if(v===c.a){locked=true;score++;btn.classList.add('good');feedback.textContent='¡Correcto! Mira cómo salta la ranita. 🐸';feedback.className='feedback ok';renderStars();await animateHops(c);successSound();confetti();feedback.textContent='¡Excelente salto! 🐸';setTimeout(()=>nextBtn.classList.add('show'),220)}else{btn.classList.add('bad');feedback.textContent='Casi. Mira otra vez el salto entre los números. 💡';feedback.className='feedback no';badSound();setTimeout(()=>btn.classList.remove('bad'),420)}}nextBtn.addEventListener('click',()=>{if(!locked)return;i++;if(i>=challenges.length)finish();else render()});function finish(){progress.style.width='100%';counter.textContent='30 de 30 · ¡Completado!';$('#gameView').style.display='none';$('#finish').classList.add('show');$('#finalText').textContent=`Completaste ${challenges.length} retos de secuencias. ¡La ranita llegó al estanque!`;successSound();confetti()}$('#restartBtn').addEventListener('click',()=>{i=0;score=0;$('#finish').classList.remove('show');$('#gameView').style.display='block';render()});$('#soundBtn').addEventListener('click',e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?'🔊':'🔇';if(soundOn)audio(700,.08)});render()})();
</script></body></html>
