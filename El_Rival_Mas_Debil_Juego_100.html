<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>El Rival Más Débil — Juego</title>
<style>
:root{--navy:#0f408f;--lime:#defc8e;--orange:#ef714b;--blue:#89adff;--sky:#bde4ff;--cream:#f9ca29;--ink:#092451;--white:#fff}
*{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,var(--navy),#071c44);color:white;min-height:100vh}
button,input{font:inherit}.wrap{max-width:1400px;margin:auto;padding:22px}.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.logo{font-weight:950;font-size:clamp(25px,4vw,52px);letter-spacing:-2px}.logo span{color:var(--lime)} .timer{text-align:center;background:#061b42;border:2px solid var(--lime);border-radius:22px;padding:10px 24px}.timer b{font-size:42px}.round{text-align:right}
.grid{display:grid;grid-template-columns:260px 1fr 280px;gap:18px;margin-top:20px}.panel,.stage{border-radius:26px;box-shadow:0 18px 50px #0005}.panel{background:#f7f3ed;color:var(--ink);padding:18px}.stage{background:linear-gradient(145deg,#164fa4,#0a2f70);padding:24px;border:1px solid #ffffff30}
h2,h3,p{margin-top:0}.players{display:grid;gap:9px}.player{padding:10px;border:2px solid transparent;border-radius:14px;background:var(--sky);cursor:pointer}.player.active{border-color:var(--navy);box-shadow:0 0 0 3px #89adff55}.player.out{text-decoration:line-through;opacity:.4}
.qnum{color:var(--lime);font-weight:800}.question{font-size:clamp(24px,3vw,42px);font-weight:850;line-height:1.12;min-height:150px;display:flex;align-items:center}.answer{background:#ffffff12;border:1px solid #ffffff35;padding:16px;border-radius:16px;font-size:21px;filter:blur(8px);user-select:none}.answer.show{filter:none}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.btn{border:0;border-radius:14px;padding:14px;font-weight:850;cursor:pointer}.good{background:var(--lime);color:var(--ink)}.bad{background:var(--orange);color:white}.bank{background:var(--blue);color:var(--ink)}.neutral{background:white;color:var(--ink)}
.ladder{display:flex;flex-direction:column-reverse;gap:6px}.step{padding:8px 12px;border-radius:10px;background:#e8eef8;display:flex;justify-content:space-between;font-weight:800}.step.hot{background:var(--lime)}.banked{font-size:32px;font-weight:950;color:var(--navy)}
.setup{position:fixed;inset:0;background:#071c44ee;display:grid;place-items:center;z-index:5}.setupCard{width:min(650px,92vw);background:var(--cream);color:var(--ink);padding:28px;border-radius:28px}.setup input{width:100%;padding:13px;border:1px solid #0002;border-radius:12px;margin:5px 0}.setup .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none}.status{display:flex;gap:12px;flex-wrap:wrap;margin:12px 0}.pill{background:#ffffff16;border-radius:999px;padding:8px 12px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.top{grid-template-columns:1fr}.round{text-align:left}.players{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:1fr 1fr}}
</style></head>
<body>
<div id="setup" class="setup"><div class="setupCard">
<h1>EL RIVAL MÁS DÉBIL</h1><p>Configura a los integrantes y comienza la ronda.</p>
<div id="names"></div>
<div class="row"><button class="btn neutral" onclick="addName()">+ Integrante</button><button class="btn good" onclick="startGame()">INICIAR JUEGO</button></div>
</div></div>
<div class="wrap">
<div class="top"><div class="logo">EL RIVAL <span>MÁS DÉBIL</span></div><div class="timer"><small>TIEMPO</small><br><b id="clock">02:30</b></div><div class="round"><b>RONDA 1</b><br><span id="turn">Turno</span></div></div>
<div class="grid">
<aside class="panel"><h3>INTEGRANTES</h3><div id="players" class="players"></div><hr><button class="btn bad" style="width:100%" onclick="eliminate()">Eliminar seleccionado</button></aside>
<main class="stage"><div class="qnum" id="qnum">PREGUNTA 1 / 100</div><div class="question" id="question"></div><div id="answer" class="answer">Respuesta</div>
<div class="status"><span class="pill">Cadena: <b id="chain">$0</b></span><span class="pill">Banco total: <b id="total">$0</b></span><span class="pill">Aciertos: <b id="hits">0</b></span></div>
<div class="actions"><button class="btn neutral" onclick="showAnswer()">VER RESPUESTA</button><button class="btn good" onclick="correct()">✓ CORRECTA</button><button class="btn bad" onclick="wrong()">✕ INCORRECTA</button><button class="btn bank" onclick="bank()">🏦 BANCO</button></div></main>
<aside class="panel"><h3>ESCALERA</h3><div id="ladder" class="ladder"></div><hr><div>BANCO ACUMULADO</div><div class="banked" id="bigTotal">$0</div><p style="font-size:12px">“Banco” guarda la cadena actual antes de responder la siguiente pregunta.</p></aside>
</div></div>
<script>
const QA=[
["¿Cuál es la capital de Argentina?","Buenos Aires"],["¿Cuántos lados tiene un hexágono?","6"],["¿Qué planeta es conocido como el planeta rojo?","Marte"],["¿Quién pintó la Mona Lisa?","Leonardo da Vinci"],["¿Cuál es el océano más grande del mundo?","Pacífico"],["¿Cuánto es 12 por 8?","96"],["¿Qué país tiene forma de bota?","Italia"],["¿Cuál es el símbolo químico del oro?","Au"],["¿En qué continente se encuentra Egipto?","África"],["¿Cuántos minutos tiene una hora y media?","90"],
["¿Quién escribió Don Quijote de la Mancha?","Miguel de Cervantes"],["¿Cuál es la capital de Japón?","Tokio"],["¿Qué órgano bombea la sangre por el cuerpo?","Corazón"],["¿Cuánto es la mitad de 150?","75"],["¿Qué idioma se habla principalmente en Brasil?","Portugués"],["¿Cuál es el satélite natural de la Tierra?","La Luna"],["¿Qué instrumento mide la temperatura?","Termómetro"],["¿Cuál es la capital de Francia?","París"],["¿Cuántos meses tienen 31 días?","7"],["¿Qué gas necesitamos principalmente para respirar?","Oxígeno"],
["¿Quién fue el primer presidente de México?","Guadalupe Victoria"],["¿Cuánto es 15 al cuadrado?","225"],["¿Cuál es el animal terrestre más rápido?","Guepardo"],["¿Qué mar separa Europa de África?","Mediterráneo"],["¿Cuántos grados tiene un ángulo recto?","90"],["¿Cuál es la moneda oficial de Japón?","Yen"],["¿Qué científico formuló las leyes del movimiento y gravitación universal?","Isaac Newton"],["¿Cuál es la capital de España?","Madrid"],["¿Cuánto es 144 dividido entre 12?","12"],["¿Qué vitamina produce el organismo por exposición de la piel al Sol?","Vitamina D"],
["¿En qué estado mexicano se encuentra Cancún?","Quintana Roo"],["¿Quién escribió Cien años de soledad?","Gabriel García Márquez"],["¿Cuál es el número romano para 50?","L"],["¿Qué país regaló la Estatua de la Libertad a Estados Unidos?","Francia"],["¿Cuál es el órgano más grande del cuerpo humano?","La piel"],["¿Cuánto es el 10% de 350?","35"],["¿Cuál es la capital de Canadá?","Ottawa"],["¿Qué metal es líquido a temperatura ambiente?","Mercurio"],["¿Qué famoso barco se hundió en 1912 durante su viaje inaugural?","Titanic"],["¿Cuántas entidades federativas tiene México?","32"],
["¿Cuál es la raíz cuadrada de 169?","13"],["¿Quién pintó La noche estrellada?","Vincent van Gogh"],["¿Qué planeta está más cerca del Sol?","Mercurio"],["¿Cuál es la capital del estado de Veracruz?","Xalapa"],["¿Qué aparato registra los movimientos sísmicos?","Sismógrafo"],["¿Cuánto es 7 por 9 menos 3?","60"],["¿Cuál es el país más grande del mundo por superficie?","Rusia"],["¿Quién escribió Romeo y Julieta?","William Shakespeare"],["¿Qué elemento químico tiene el símbolo O?","Oxígeno"],["¿Cuál es la capital de Alemania?","Berlín"],
["¿En qué año comenzó la Independencia de México?","1810"],["¿Cuánto es tres cuartas partes de 100?","75"],["¿Cuál es el hueso más largo del cuerpo humano?","Fémur"],["¿Qué país tiene como capital a Lima?","Perú"],["¿Quién formuló la teoría de la relatividad?","Albert Einstein"],["¿Cuántos segundos hay en cinco minutos?","300"],["¿Qué río atraviesa París?","Sena"],["¿En qué estado mexicano está Chichén Itzá?","Yucatán"],["¿Cuál es el antónimo de escaso?","Abundante"],["¿Qué planeta posee los anillos más visibles?","Saturno"],
["¿Cuánto es el 25% de 200?","50"],["¿Quién fue conocido como el Benemérito de las Américas?","Benito Juárez"],["¿Cuál es la capital de Australia?","Canberra"],["¿Qué mamífero puede volar de manera sostenida?","Murciélago"],["¿Qué escritor mexicano escribió Pedro Páramo?","Juan Rulfo"],["¿Cuánto suman los ángulos interiores de un triángulo?","180 grados"],["¿Qué país tiene como capital a Bogotá?","Colombia"],["¿Qué células de la sangre transportan principalmente oxígeno?","Glóbulos rojos"],["¿Cuál es el número primo que sigue al 19?","23"],["¿En qué continente se encuentra Noruega?","Europa"],
["¿Qué civilización construyó Machu Picchu?","Inca"],["¿Cuánto es 11 por 11?","121"],["¿Qué capa de la atmósfera contiene la mayor parte del ozono?","Estratosfera"],["¿Quién pintó Las meninas?","Diego Velázquez"],["¿Cuál es la capital de Chile?","Santiago"],["¿Cómo se llama una palabra que significa lo contrario de otra?","Antónimo"],["¿Cuánto es 1,000 menos 375?","625"],["¿Quién desarrolló la teoría de la evolución por selección natural?","Charles Darwin"],["¿Cuál es el estado más grande de México por superficie?","Chihuahua"],["¿Cuántos jugadores tiene un equipo de fútbol en el campo al comenzar?","11"],
["¿Cuál es la capital de Italia?","Roma"],["¿Qué órgano produce insulina?","Páncreas"],["Un producto cuesta 500 pesos y tiene 20% de descuento. ¿Cuánto pagas?","400 pesos"],["¿Quién escribió El principito?","Antoine de Saint-Exupéry"],["¿Qué océano se encuentra al este de México?","Atlántico"],["¿Cuál es la fórmula química del agua?","H₂O"],["¿En qué año llegó Cristóbal Colón a América?","1492"],["¿Cuánto es 2 elevado a la quinta potencia?","32"],["¿Qué país tiene como capital a Atenas?","Grecia"],["¿Cómo se llama el proceso por el que las plantas convierten energía luminosa en química?","Fotosíntesis"],
["¿Quién encabezó el inicio de la Independencia de México con el Grito de Dolores?","Miguel Hidalgo"],["¿Cuál es la raíz cuadrada de 225?","15"],["¿Qué escritor creó a Sherlock Holmes?","Arthur Conan Doyle"],["¿Cuál es la capital de China?","Pekín"],["¿Qué parte de una célula eucariota contiene principalmente el ADN?","Núcleo"],["Si tienes 3 docenas de huevos, ¿cuántos tienes?","36"],["¿Qué mexicano recibió el Premio Nobel de Literatura en 1990?","Octavio Paz"],["¿Qué línea imaginaria divide la Tierra en hemisferio norte y sur?","Ecuador"],["¿Cuánto es 18 por 5 dividido entre 3?","30"],["¿Qué científico mexicano recibió el Premio Nobel de Química en 1995?","Mario Molina"]
];
const values=[0,100,250,500,1000,2000,5000,10000];let names=[],active=0,selected=0,q=0,level=0,total=0,hits=0,time=150,tick=null;
function addName(v=""){let d=document.createElement("input");d.placeholder="Nombre del integrante";d.value=v;document.querySelector("#names").appendChild(d)}
["Jugador 1","Jugador 2","Jugador 3","Jugador 4","Jugador 5","Jugador 6"].forEach(addName);
function startGame(){names=[...document.querySelectorAll("#names input")].map(x=>x.value.trim()).filter(Boolean);if(names.length<2)return alert("Agrega al menos 2 integrantes.");document.querySelector("#setup").classList.add("hidden");renderPlayers();renderLadder();loadQ();tick=setInterval(()=>{if(time>0){time--;clock.textContent=String(Math.floor(time/60)).padStart(2,"0")+":"+String(time%60).padStart(2,"0")}else{clearInterval(tick);alert("¡Tiempo! Fin de la ronda.")}},1000)}
function renderPlayers(){players.innerHTML="";names.forEach((n,i)=>{let d=document.createElement("div");d.className="player "+(i===active?"active ":"")+(n===null?"out":"");d.textContent=n||"ELIMINADO";d.onclick=()=>{selected=i;[...players.children].forEach((x,j)=>x.style.outline=j===i?"3px solid #ef714b":"");};players.appendChild(d)});turn.textContent="Turno: "+(names[active]||"")}
function renderLadder(){ladder.innerHTML="";values.slice(1).forEach((v,i)=>{let d=document.createElement("div");d.className="step "+(level===i+1?"hot":"");d.innerHTML=`<span>Nivel ${i+1}</span><span>$${v}</span>`;ladder.appendChild(d)});chain.textContent="$"+values[level];totalEl()}
function totalEl(){total.textContent="$"+window.total;bigTotal.textContent="$"+window.total}
function loadQ(){qnum.textContent=`PREGUNTA ${q+1} / ${QA.length}`;question.textContent=QA[q][0];answer.textContent=QA[q][1];answer.classList.remove("show")}
function showAnswer(){answer.classList.toggle("show")}
function nextPlayer(){let tries=0;do{active=(active+1)%names.length;tries++}while(names[active]===null&&tries<=names.length);renderPlayers()}
function correct(){hits++;document.querySelector("#hits").textContent=hits;level=Math.min(level+1,values.length-1);q=(q+1)%QA.length;nextPlayer();renderLadder();loadQ()}
function wrong(){level=0;q=(q+1)%QA.length;nextPlayer();renderLadder();loadQ()}
function bank(){window.total+=values[level];level=0;renderLadder()}
function eliminate(){if(names.filter(Boolean).length<=2)return alert("Deben quedar al menos 2 finalistas.");names[selected]=null;if(active===selected)nextPlayer();renderPlayers()}
window.total=0;
</script></body></html>
