<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cortador de Caña — Poblado 3</title></head>
<body style="margin:0;background:#0d2117;color:white;font-family:system-ui;text-align:center"><p id="loading">Cargando juego…</p>
<script>
(async()=>{
 const r=await fetch('./Cortador_de_Cana_Poblado_3_Musica.html?v='+Date.now());
 let h=await r.text();
 const css=`<style>
@media(max-width:650px){
 html,body{min-height:100%;background:#0d2117}
 .app{padding:5px 6px 10px;max-width:none}
 .header{display:block;margin-bottom:5px}
 .brand h1{font-size:1.12rem;line-height:1.05}
 .place-title{font-size:.92rem!important;letter-spacing:.025em;margin:.18rem 0 .08rem!important}
 .brand p:not(.place-title){display:none}
 .hud{gap:4px;margin-top:6px;width:100%;max-width:none}
 .stat{border-radius:10px;padding:4px 3px}.stat b{font-size:1rem}.stat span{font-size:.57rem}
 .game-shell{border-radius:14px;border-width:2px;min-height:54vw}
 canvas{width:100%;height:auto;min-height:54vw;object-fit:cover}
 .overlay{padding:6px;align-items:center;overflow:auto;-webkit-overflow-scrolling:touch}
 .card{width:min(96%,520px);max-height:calc(100% - 6px);overflow:auto;padding:9px 11px;border-radius:15px}
 .card h2{font-size:1.22rem;margin:0 0 3px}.card p{font-size:.72rem;line-height:1.18;margin:3px 0 5px}
 .legend{gap:3px;margin:4px 0}.chip{padding:3px 5px;font-size:.56rem}
 .instructions{grid-template-columns:repeat(3,1fr)!important;gap:3px;margin-top:4px}.tip{padding:4px 2px;font-size:.55rem;line-height:1.1}
 .controls{margin-top:5px}.primary,.secondary{min-height:38px;padding:0 14px}
 #startBtn{position:sticky;bottom:0;width:100%;font-size:.95rem;z-index:20;box-shadow:0 -6px 18px #102419cc,inset 0 -3px #b88613}
 #touchControls{grid-template-columns:repeat(3,1fr)!important;gap:5px;margin-top:6px}
 #touchControls button{min-height:46px;border-radius:13px;font-size:.76rem;padding:4px}
 #cutBtn{font-size:.82rem!important}
 .mobile-controls{gap:5px;margin-top:6px}.mobile-controls .pause-btn{min-height:44px;border-radius:12px;font-size:.74rem}
 .footer{font-size:.6rem;padding:6px 0 0}
}
@media(max-width:390px){.card p{font-size:.68rem}.chip{font-size:.53rem}.tip{font-size:.52rem}}
</style>`;
 h=h.replace('</head>',css+'</head>');
 document.open();document.write(h);document.close();
})().catch(e=>{document.getElementById('loading').textContent='No se pudo cargar el juego. Recarga la página.'});
</script></body></html>
