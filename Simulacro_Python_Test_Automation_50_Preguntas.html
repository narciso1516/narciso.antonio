<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simulacro Técnico — Python Test Automation</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--accent:#2563eb;--accent2:#0f766e;--danger:#b42318;--ok:#067647;--border:#d0d5dd;--soft:#eef4ff}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:980px;margin:auto;padding:24px}.hero,.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 8px 28px rgba(16,24,40,.06)}
.hero,.card{padding:24px}.hero{margin-bottom:18px}h1{margin:0 0 8px;font-size:clamp(28px,4vw,44px)}p{line-height:1.55}
.badges,.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.badge{padding:7px 10px;border-radius:999px;background:var(--soft);font-size:13px}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f6}.ghost{background:#fff;border:1px solid var(--border)}
.progress{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:16px 0 8px}.bar{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#0f766e)}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.section-title{font-size:13px;font-weight:800;text-transform:uppercase;color:var(--accent2);margin-bottom:8px}
.theory{background:#f8fafc;border-left:4px solid var(--accent);padding:14px 16px;border-radius:10px;margin:12px 0 18px}.question{font-size:22px;font-weight:800;line-height:1.35;margin:10px 0 14px}
pre{background:#101828;color:#f2f4f7;padding:16px;border-radius:12px;overflow:auto;font-size:14px}.options{display:grid;gap:10px;margin:14px 0}.option{display:flex;gap:10px;border:1px solid var(--border);padding:14px;border-radius:12px;background:#fff}
textarea{width:100%;padding:14px;border:1px solid var(--border);border-radius:12px;font:inherit}.feedback{display:none;margin-top:16px;padding:14px;border-radius:12px}.feedback.ok{display:block;background:#ecfdf3;color:var(--ok)}.feedback.bad{display:block;background:#fef3f2;color:var(--danger)}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.hidden{display:none!important}.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:16px 0}.stat{background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:16px}.stat b{font-size:28px;display:block}.review-item{border-top:1px solid var(--border);padding:14px 0}.small{font-size:13px;color:var(--muted)}.footer{text-align:center;padding:22px;color:var(--muted);font-size:13px}@media(max-width:640px){.app{padding:12px}.question{font-size:19px}}
</style></head><body><div class="app">
<section class="hero" id="intro"><div class="section-title">Simulacro técnico</div><h1>Python Test Automation</h1>
<p>Examen de práctica: Python + venv, Git + rebase, PEP 8 + Ruff, OOP + análisis estático y pytest.</p>
<div class="badges"><span class="badge">50 reactivos</span><span class="badge">Opciones aleatorizadas</span><span class="badge">Retroalimentación</span><span class="badge">Reporte final</span></div>
<div class="controls"><button class="primary" onclick="startExam()">Iniciar simulacro</button><button class="secondary" onclick="toggleStudyMode()">Modo estudio: <span id="studyState">ON</span></button></div></section>
<section class="card hidden" id="exam"><div class="meta"><span id="counter"></span><span id="timer">00:00</span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="sectionTitle" class="section-title"></div><div id="theory" class="theory"></div><div id="questionBox"></div><div id="feedback" class="feedback"></div><div class="nav"><button class="ghost" onclick="prevQuestion()">Anterior</button><button class="primary" id="checkBtn" onclick="checkAnswer()">Comprobar</button><button class="secondary hidden" id="nextBtn" onclick="nextQuestion()">Siguiente</button></div></section>
<section class="card hidden" id="report"></section><div class="footer">Simulacro de práctica — Python Test Automation</div></div>
<script>
let studyMode=true,current=0,startedAt=null,timerInt=null,answers={},checked={};
const raw=[
["Python + venv","¿Qué devuelve?<pre>[v for v in [1,2,3,4,5,6] if v % 2 == 0]</pre>",["[1, 3, 5]","[2, 4, 6]","[1,2,3,4,5,6]","[0,2,4,6]"],1,"List comprehensions filtran o transforman colecciones.","Filtra valores pares."],
["Python + venv","¿Cuál firma recibe y devuelve una lista de enteros?",["def f(values: list[int]) -> list[int]:","def f(values) => list[int]:","function f(list[int]) -> list[int]:","def f(values: int[]) -> int[]:"],0,"Los type hints documentan el contrato esperado.","La sintaxis moderna usa list[int] y ->."],
["Python + venv","¿Qué usarías para una copia completamente independiente de una estructura anidada?",["copy.copy()","copy.deepcopy()","list.copy() siempre","="],1,"Shallow copy copia el contenedor; deep copy copia recursivamente.","deepcopy() copia objetos anidados."],
["Python + venv","¿Qué comando crea un entorno virtual llamado venv?",["python -m venv venv","pip create venv","python --venv create","venv init"],0,"Un venv aísla dependencias por proyecto.","python -m venv venv."],
["Python + venv","En Linux/macOS, ¿cómo activas venv?",["source venv/bin/activate",".\\venv\\Scripts\\Activate.ps1","venv --activate","python venv/activate"],0,"La activación cambia según el sistema.","En Bash: source venv/bin/activate."],
["Python + venv","¿Qué comando guarda dependencias en requirements.txt?",["pip freeze > requirements.txt","pip list > requirements.txt","pip install requirements.txt","python freeze requirements.txt"],0,"pip freeze lista paquetes con versiones.","pip freeze > requirements.txt."],
["Python + venv","¿Qué resultado produce?<pre>[round((c*9/5)+32,2) for c in [0,100]]</pre>",["[0,100]","[32.0,212.0]","[32,180]","[0.0,212.0]"],1,"Una comprehension también transforma valores.","0°C=32°F y 100°C=212°F."],
["Python + venv","Si haces b = a para una lista y modificas b, ¿qué puede ocurrir?",["a también refleja el cambio","a nunca cambia","se crea deepcopy","TypeError"],0,"= crea otra referencia al mismo objeto.","a y b apuntan al mismo objeto."],
["Python + venv","¿Cuál nombre es más claro para filtrar velocidades positivas?",["def x(v):","def filter_positive_speeds(speeds):","def DoIt(a):","def f1(data):"],1,"Los nombres deben expresar intención.","filter_positive_speeds sigue snake_case."],
["Python + venv","Si la consigna exige list comprehension, ¿qué debes hacer?",["Usar for","Usar específicamente list comprehension","Ignorar la restricción","Usar while"],1,"La técnica solicitada puede ser parte de la evaluación.","Cumple exactamente la técnica pedida."],
["Python + venv","¿Qué instala dependencias desde requirements.txt?",["pip install -r requirements.txt","pip freeze requirements.txt","python -r requirements.txt","pip sync requirements.txt"],0,"-r indica archivo de requisitos.","pip install -r requirements.txt."],
["Python + venv","¿Cuál expresión filtra valores mayores que 10?",["[v for v in values if v > 10]","[v if v > 10 for values]","values.filter(>10)","for v > 10 in values"],0,"Practica escribiendo código, no solo leyendo.","La primera es una comprehension válida."],
["Git + rebase","¿Cuál es el flujo diario correcto?",["status → add → commit → push","add → status → push → commit","commit → add → status → push","push → commit → add → status"],0,"Flujo típico: status, add, commit, push.","Ese es el orden indicado."],
["Git + rebase","¿Qué crea y cambia a feature/login?",["git checkout -b feature/login","git branch --push feature/login","git new feature/login","git switch origin/feature/login"],0,"Una feature branch aísla cambios.","checkout -b crea y cambia."],
["Git + rebase","¿Cómo publicas feature/login configurando tracking?",["git push -u origin feature/login","git push feature/login origin","git publish feature/login","git upstream push feature/login"],0,"-u configura upstream.","git push -u origin feature/login."],
["Git + rebase","¿Qué operación suele producir historial más lineal?",["merge","rebase","stash","clone"],1,"Rebase reaplica commits sobre otra base.","Rebase."],
["Git + rebase","Tras resolver un conflicto de rebase, ¿qué sigue?",["git add <file> → git rebase --continue","git commit --force → git push","git merge --abort","git stash → git reset --hard"],0,"Resuelve, añade y continúa.","git add y git rebase --continue."],
["Git + rebase","Tras rebase de una rama publicada, ¿qué push es más seguro?",["git push --force","git push --force-with-lease","git push --hard","git push --rewrite"],1,"--force-with-lease protege contra cambios remotos inesperados.","Usa --force-with-lease."],
["Git + rebase","Antes de rebasar contra development remoto, ¿qué es apropiado?",["git fetch origin","git reset --hard","git clean -fd","git init"],0,"fetch actualiza referencias remotas.","git fetch origin."],
["Git + rebase","¿Qué reaplica tus commits sobre origin/development?",["git rebase origin/development","git merge --rebase development","git replay origin/development","git branch origin/development"],0,"Rebase cambia la base de tus commits.","git rebase origin/development."],
["Git + rebase","¿Cuál descripción de merge es correcta?",["Reescribe cada commit","Une historiales y puede crear merge commit","Elimina conflictos","Siempre es lineal"],1,"Merge conserva la forma de ramas.","Une historiales."],
["Git + rebase","¿Qué comando cancela un rebase en curso si decides no continuar?",["git rebase --abort","git rebase --delete","git reset rebase","git abort"],0,"Git permite abortar el rebase y volver al estado anterior.","git rebase --abort."],
["PEP 8 + Ruff","¿Nombre adecuado para una función?",["CalculateTotal","calculate_total","calculateTotal","CALCULATE-TOTAL"],1,"Funciones y variables usan snake_case.","calculate_total."],
["PEP 8 + Ruff","¿Nombre adecuado para una clase?",["vehicle_manager","VehicleManager","vehicleManager","VEHICLE_MANAGER"],1,"Clases usan PascalCase.","VehicleManager."],
["PEP 8 + Ruff","¿Qué comando revisa el proyecto?",["ruff check .","ruff scan .","ruff inspect .","ruff lint --all"],0,"Ruff revisa estilo y reglas.","ruff check ."],
["PEP 8 + Ruff","¿Qué intenta corregir automáticamente?",["ruff check . --fix","ruff fix . --all","ruff check --repair","ruff auto ."],0,"Ruff permite auto-fix.","ruff check . --fix."],
["PEP 8 + Ruff","¿Cuál está mejor formateada?",["def add(a,b):return a+b","def add(a, b):\n    return a + b","def Add(a,b): return a+b","def add( a , b ): return a+b"],1,"PEP 8 pide espacios, indentación y snake_case.","La segunda."],
["PEP 8 + Ruff","¿Qué opción es más mantenible?",["x = calculate(v)","total_speed = calculate_average(speeds)","a1 = f(b2)","z = do_it(y)"],1,"Nombres descriptivos mejoran claridad.","La segunda comunica intención."],
["PEP 8 + Ruff","¿Cómo ignoras S307 en una línea?",["# noqa: S307","# ignore all","# ruff-off","# pep8:none"],0,"noqa puede ignorar una regla puntual.","# noqa: S307."],
["PEP 8 + Ruff","¿Cómo debe escribirse CalculateTotal como función PEP 8?",["calculate_total","Calculate_Total","calculateTotal","CALCULATE_TOTAL"],0,"Funciones usan snake_case.","calculate_total."],
["OOP + Static Analysis","¿Qué método inicializa una instancia?",["__init__","__start__","constructor","init()"],0,"Una clase simple tiene constructor y métodos.","__init__."],
["OOP + Static Analysis","Car hereda Vehicle y redefine info(). ¿Qué es?",["overloading","overriding","encapsulation","composition"],1,"Overriding redefine un método heredado.","Overriding."],
["OOP + Static Analysis","¿Cuál afirmación es correcta?",["Python soporta overriding naturalmente","Python no permite herencia","Python exige overloading por tipos","Python prohíbe redefinir métodos"],0,"Python soporta overriding de forma natural.","La primera."],
["OOP + Static Analysis","¿Qué respeta mejor Single Responsibility?",["PageObject parsea reportes y envía emails","PageObject solo modela interacción con la página","Driver administra DB y métricas","Fixture contiene toda la lógica"],1,"SRP: una responsabilidad principal.","La segunda."],
["OOP + Static Analysis","¿Qué está alineado con Dependency Inversion?",["Hard-codear driver","Inyectar driver o mock","Duplicar driver","Usar globales"],1,"Conviene inyectar dependencias.","Inyectar driver o mock."],
["OOP + Static Analysis","¿Qué herramienta usa type hints para análisis estático?",["mypy","pytest","Git","venv"],0,"mypy detecta incompatibilidades de tipos.","mypy."],
["OOP + Static Analysis","¿Por qué importa la complejidad ciclomática?",["Alta complejidad dificulta entender y mantener","Aumenta cobertura automáticamente","Sustituye pytest","Elimina mocks"],0,"Mide caminos lógicos independientes.","Alta complejidad perjudica mantenibilidad."],
["OOP + Static Analysis","¿Qué puede detectar análisis estático?",["Incompatibilidad de tipos","Latencia real de ECU","Falla física de sensor","Temperatura del laboratorio"],0,"Opera sin ejecutar el programa.","Incompatibilidades de tipos."],
["OOP + Static Analysis","Si Car.info() redefine Vehicle.info(), para una instancia Car se usa…",["siempre Vehicle.info()","la implementación de Car","error","ambas automáticamente"],1,"La subclase personaliza comportamiento heredado.","La implementación de Car."],
["OOP + Static Analysis","¿Qué principio SOLID busca una sola responsabilidad?",["Single Responsibility Principle","Open/Closed solamente","Liskov solamente","Interface Segregation solamente"],0,"SRP limita responsabilidades por clase.","Single Responsibility Principle."],
["pytest","¿Cuál test realmente verifica un resultado?",["def test1(): parse_speed('50 kph')","def test_parse_speed():\n    assert parse_speed('50 kph') == 50.0","def check(): pass","def test_speed(): print(parse_speed('50 kph'))"],1,"Un test útil expresa una expectativa.","El segundo usa assert."],
["pytest","¿Qué decorador define una fixture?",["@pytest.fixture","@pytest.mock","@fixture.pytest","@pytest.setup"],0,"Fixtures encapsulan setup reutilizable.","@pytest.fixture."],
["pytest","¿De dónde proviene Mock en la guía?",["unittest.mock","pytest.mock","typing.mock","venv.mock"],0,"Mock sustituye colaboradores.","unittest.mock."],
["pytest","¿Qué decorador parametriza casos?",["@pytest.mark.parametrize","@pytest.parametrize.all","@pytest.fixture(params_only=True)","@pytest.data"],0,"Parametrize ejecuta el mismo test con varios casos.","@pytest.mark.parametrize."],
["pytest","¿Cuál nombre de test es mejor?",["test1","test_parse_speed_ok","testing","case_a"],1,"El nombre debe describir lo verificado.","test_parse_speed_ok."],
["pytest","Para parse_speed, ¿qué caso es correcto?",["('50 kph', 50.0)","('50 kph', 'fifty')","(50, '50 kph')","('kph 50', None)"],0,"Entrada texto, salida float.","('50 kph', 50.0)."],
["pytest","Si framework.start.return_value = True, framework.start() devuelve…",["True","False","None","Mock.start"],0,"El mock fue configurado con return_value.","True."],
["pytest","¿Por qué un test sin assert suele ser débil?",["No expresa expectativa verificable","pytest no permite funciones","assert solo sirve en producción","mocks reemplazan asserts"],0,"Ejecutar no equivale a verificar.","No expresa expectativa."],
["pytest","¿Ventaja principal de parametrizar 0, 50 y 120 kph?",["Misma lógica con múltiples casos","Evitar assert","Eliminar fixtures","Convertir pytest en unittest"],0,"Reduce duplicación.","Misma prueba, múltiples entradas."],
["pytest","¿Qué palabra clave comprueba una condición en un test simple?",["assert","verify","expect","check"],0,"Un test básico usa assert.","assert."]
];
const questions=raw.map(x=>({sec:x[0],q:x[1],options:x[2],a:x[3],theory:x[4],exp:x[5]}));
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function prepare(){questions.forEach(q=>{let p=shuffle(q.options.map((o,i)=>({o,i})));q.shuffled=p;q.correctIndex=p.findIndex(x=>x.i===q.a)})}
function toggleStudyMode(){studyMode=!studyMode;studyState.textContent=studyMode?"ON":"OFF";if(!exam.classList.contains("hidden"))render()}
function startExam(){prepare();intro.classList.add("hidden");exam.classList.remove("hidden");startedAt=Date.now();timerInt=setInterval(()=>{let s=Math.floor((Date.now()-startedAt)/1000);timer.textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")},1000);render()}
function render(){let q=questions[current];counter.textContent=`Pregunta ${current+1} / ${questions.length}`;bar.style.width=`${(current+1)/questions.length*100}%`;sectionTitle.textContent=q.sec;theory.innerHTML="<b>Antes de responder</b><br>"+q.theory;theory.classList.toggle("hidden",!studyMode);questionBox.innerHTML=`<div class="question">${q.q}</div><div class="options">${q.shuffled.map((x,i)=>`<label class="option"><input type="radio" name="ans" value="${i}" ${answers[current]==i?"checked":""}><span>${String.fromCharCode(65+i)}) ${x.o.replace(/\n/g,"<br>")}</span></label>`).join("")}</div>`;feedback.className="feedback";feedback.innerHTML="";checkBtn.classList.toggle("hidden",!!checked[current]);nextBtn.classList.toggle("hidden",!checked[current]);if(checked[current])showFeedback(checked[current].ok,checked[current].msg)}
function save(){let s=document.querySelector('input[name="ans"]:checked');if(s)answers[current]=Number(s.value)}
function checkAnswer(){save();if(answers[current]===undefined){alert("Selecciona una respuesta.");return}let q=questions[current],ok=answers[current]===q.correctIndex;checked[current]={ok,msg:q.exp};showFeedback(ok,q.exp);checkBtn.classList.add("hidden");nextBtn.classList.remove("hidden")}
function showFeedback(ok,msg){feedback.className="feedback "+(ok?"ok":"bad");feedback.innerHTML=(ok?"✅ <b>Correcto.</b> ":"❌ <b>Revisa.</b> ")+msg}
function nextQuestion(){save();if(current<questions.length-1){current++;render()}else finish()}
function prevQuestion(){save();if(current>0){current--;render()}}
function finish(){clearInterval(timerInt);let score=Object.values(checked).filter(x=>x.ok).length,total=questions.length,pct=Math.round(score/total*100),secs={};questions.forEach((q,i)=>{secs[q.sec]??={n:0,ok:0};secs[q.sec].n++;if(checked[i]?.ok)secs[q.sec].ok++});let elapsed=Math.floor((Date.now()-startedAt)/1000);exam.classList.add("hidden");report.classList.remove("hidden");report.innerHTML=`<div class="section-title">Reporte final</div><h2>Resultado: ${score}/${total} — ${pct}%</h2><p>Tiempo: <b>${Math.floor(elapsed/60)} min ${elapsed%60} s</b></p><div class="report-grid">${Object.entries(secs).map(([k,v])=>`<div class="stat"><span>${k}</span><b>${Math.round(v.ok/v.n*100)}%</b><small>${v.ok}/${v.n} correctas</small></div>`).join("")}</div><h3>Reactivos a repasar</h3>${questions.map((q,i)=>checked[i]?.ok?"":`<div class="review-item"><b>${i+1}. ${q.sec}</b><div>${q.q}</div><div class="small">${q.exp}</div></div>`).join("")||"<p>¡Sin errores!</p>"}<div class="controls"><button class="primary" onclick="location.reload()">Repetir</button><button class="secondary" onclick="window.print()">Imprimir / Guardar PDF</button></div>`}
</script></body></html>
